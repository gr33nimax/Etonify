name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 .github/scripts/test_hydrate_libbox.py
      - run: python3 .github/scripts/hydrate_libbox.py
      - run: ./gradlew ciCheck --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-artifacts
          path: '**/build/**'
          if-no-files-found: error
